name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run the slow tests (full-N_BOOT golden regressions, full-length episode)"
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PPO_IBM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: PPO_IBM/requirements-dev.txt
      - name: Install CPU torch and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Fast suite (pytest.ini excludes @pytest.mark.slow)
        run: python -m pytest
      - name: Slow suite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.slow }}
        run: python -m pytest -m slow
