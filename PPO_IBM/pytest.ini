[pytest]
testpaths = tests
addopts = -m "not slow" -ra
markers =
    slow: takes more than ~20 s (full-N_BOOT golden regressions, harness smoke runs); excluded by default, run with `pytest -m slow` or `pytest -m ""`
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
